<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mobile previews | The Veritas Group</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #101013; }
    body { margin: 0; min-height: 100svh; padding: 32px 24px; display: flex; align-items: center; }
    main { display: flex; gap: 24px; width: max-content; margin: auto; }
    .phone { position: relative; flex: 0 0 auto; width: 410px; padding: 28px 8px 12px; border: 2px solid #3b3b41; border-radius: 42px; background: #080809; box-shadow: 0 16px 48px rgb(0 0 0 / 35%); }
    .phone::before { content: ""; position: absolute; top: 10px; left: 50%; width: 72px; height: 6px; border-radius: 10px; background: #303035; transform: translateX(-50%); }
    iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 26px; background: black; }
    @media (max-width: 1325px) { body { align-items: flex-start; } }
  </style>
</head>
<body>
  <main aria-label="Three mobile layout previews">
    <div class="phone"><iframe title="Option A mobile preview" src="../temp/conferences/veritasch3.html?layout=balanced"></iframe></div>
    <div class="phone"><iframe title="Option B mobile preview" src="../temp/conferences/veritasch3.html?layout=compact"></iframe></div>
    <div class="phone"><iframe title="Current live mobile preview" src="https://veritasgroup.in/conferences/veritasch3"></iframe></div>
  </main>
</body>
</html>
