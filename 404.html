<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | The Veritas Group</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: "Raleway", system-ui, sans-serif; background: #060606; color: #fffff0; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 32px 24px; background: radial-gradient(ellipse at top, #07333a, transparent 65%); }
    main { width: min(100%, 520px); text-align: center; }
    .brand { display: inline-block; margin-bottom: 40px; color: #fff; font-size: 22px; font-weight: 700; text-decoration: none; }
    .brand span { color: #04a5b9; }
    .code { margin: 0; color: #04a5b9; font-size: clamp(96px, 26vw, 160px); font-weight: 800; line-height: 1; letter-spacing: -.06em; }
    h1 { margin: 24px 0 16px; font-size: clamp(28px, 6vw, 38px); line-height: 1.2; }
    p { margin: 0; color: #c3c9ca; font-size: 16px; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; border: 1px solid #04a5b9; border-radius: 6px; color: #fff; text-decoration: none; }
    nav a:first-child { background: #07333a; }
    a:hover { background: #0b4149; }
    a:focus-visible { outline: 3px solid #04a5b9; outline-offset: 4px; }
    @media (max-width: 380px) { nav { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">The Veritas Group<span>.</span></a>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>This page may have moved, or the link may be incorrect. Let’s get you back to Veritas.</p>
    <nav aria-label="Find your way back">
      <a href="/">Back to home</a>
      <a href="/#services">Explore conferences</a>
    </nav>
  </main>
</body>
</html>
